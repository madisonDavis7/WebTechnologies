<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Dataset Table</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 30px;
      background: #000;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #fff;
      margin-top: 0;
      font-size: 2.5em;
      font-weight: 300;
      letter-spacing: 1px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px;
      margin: 30px auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background: #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #444;
      text-align: left;
      vertical-align: middle;
      color: #e0e0e0;
    }
    th {
      background-color: #41042c;
      color: white;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid #555;
    }
    tr.highlighted {
      background-color: #3a3a3a;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body>

  <h1>Color Dataset Table</h1>
  <table id="colors-table">
    <thead>
      <tr>
        <th>Color</th>
        <th>Name</th>
        <th>Hex</th>
        <th>RGB</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      <!-- Rows will be dynamically inserted here -->
    </tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
