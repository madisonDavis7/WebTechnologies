<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lost in Space</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      font-family: monospace;
      color: white;
    }

    #oxygen-label {
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    #oxygen-bar-bg {
      width: 200px;
      height: 14px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 7px;
      overflow: hidden;
    }

    #oxygen-fill {
      height: 100%;
      width: 100%;
      background: #4caf50;
      border-radius: 7px;
      transition: width 0.15s linear, background-color 0.4s;
    }

    #hint {
      margin-top: 7px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-style: italic;
    }

    /* Black overlay that fades in on death */
    #death-screen {
      position: fixed;
      inset: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3.5s ease-in;
    }

    #death-screen.visible {
      opacity: 1;
      pointer-events: all;
    }

    #death-screen p {
      color: rgba(255, 255, 255, 0.75);
      font-family: Georgia, serif;
      font-size: 22px;
      font-style: italic;
      letter-spacing: 3px;
      text-align: center;
      opacity: 0;
    }

    /* Text fades in after the black screen is already showing */
    #death-screen.visible p {
      animation: textReveal 2.5s ease-in 2.5s forwards;
    }

    @keyframes textReveal {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="hud">
    <div id="oxygen-label">O₂ Level</div>
    <div id="oxygen-bar-bg">
      <div id="oxygen-fill"></div>
    </div>
    <div id="hint">click the plant to refill</div>
  </div>

  <div id="death-screen">
    <p>slowly you fade into unconsciousness</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.155.0/build/three.module.min.js",
        "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js"></script>
</body>
  <!-- Background Music -->
  <audio id="bg-music" src="space_music.mp3" autoplay loop hidden></audio>
</html>
