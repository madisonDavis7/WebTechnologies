<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pink World</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<h1>✿ Pink World ✿</h1>

<div id="hud">
  <div id="score-display">Score: <span id="score-val">0</span></div>
  <div id="hint">Arrow keys to move &nbsp;·&nbsp; Collect the gems!</div>
</div>

<canvas id="game-canvas" width="680" height="480"></canvas>
<div id="win-banner" id="win-banner"> You collected everything! Final score: <span id="final-score"></span></div>

<script>

const OBSTACLES_DATA = [
  { id:1, x:100, y:80,  width:80,  height:80,  color:"#f48fb1" },
  { id:2, x:300, y:150, width:120, height:40,  color:"#f06292" },
  { id:3, x:480, y:60,  width:50,  height:140, color:"#ec407a" },
  { id:4, x:150, y:300, width:160, height:40,  color:"#f48fb1" },
  { id:5, x:380, y:320, width:40,  height:120, color:"#f06292" },
  { id:6, x:560, y:260, width:100, height:60,  color:"#ad1457" },
  { id:7, x:60,  y:200, width:40,  height:100, color:"#e91e8c" }
];

const COLLECTIBLES_DATA = [
  { id:1, x:220, y:100, radius:14, color:"#fff176", points:10 },
  { id:2, x:440, y:200, radius:14, color:"#ffe082", points:10 },
  { id:3, x:130, y:380, radius:14, color:"#ffcc02", points:10 },
  { id:4, x:500, y:370, radius:14, color:"#fff59d", points:20 },
  { id:5, x:330, y:270, radius:14, color:"#ffd54f", points:20 }
];

//  CLASS: Obstacle
class Obstacle {
  constructor({ id, x, y, width, height, color }) {
    this.id     = id;
    this.x      = x;
    this.y      = y;
    this.width  = width;
    this.height = height;
    this.color  = color;
  }

  draw(ctx) {
    ctx.save();
    ctx.shadowColor = "rgba(173,20,87,0.22)";
    ctx.shadowBlur  = 10;
    ctx.shadowOffsetY = 4;

    this._roundRect(ctx, this.x, this.y, this.width, this.height, 10);
    ctx.fillStyle = this.color;
    ctx.fill();

    const grd = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height * 0.5);
    grd.addColorStop(0,   "rgba(255,255,255,0.28)");
    grd.addColorStop(1,   "rgba(255,255,255,0)");
    this._roundRect(ctx, this.x, this.y, this.width, this.height, 10);
    ctx.fillStyle = grd;
    ctx.fill();

    this._roundRect(ctx, this.x, this.y, this.width, this.height, 10);
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth   = 2;
    ctx.stroke();

    ctx.restore();
  }

  _roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y,     x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h,     x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y,         x + r, y);
    ctx.closePath();
  }

  // AABB rectangle check
  collidesWith(rx, ry, rw, rh) {
    return rx < this.x + this.width  &&
           rx + rw > this.x          &&
           ry < this.y + this.height &&
           ry + rh > this.y;
  }
}

//  CLASS: Collectible
class Collectible {
  constructor({ id, x, y, radius, color, points }) {
    this.id     = id;
    this.x      = x;
    this.y      = y;
    this.radius = radius;
    this.color  = color;
    this.points = points;
    this.active = true;
    this._t     = Math.random() * Math.PI * 2; // for bobbing
  }

  update(dt) {
    this._t += dt * 2.2;
  }

  draw(ctx) {
    if (!this.active) return;
    const bob = Math.sin(this._t) * 3;

    ctx.save();
    ctx.shadowColor  = this.color;
    ctx.shadowBlur   = 18;

    ctx.beginPath();
    ctx.arc(this.x, this.y + bob, this.radius + 4, 0, Math.PI * 2);
    ctx.strokeStyle = this.color + "70";
    ctx.lineWidth   = 3;
    ctx.stroke();

    ctx.translate(this.x, this.y + bob);
    ctx.rotate(Math.PI / 4);
    ctx.beginPath();
    const s = this.radius * 1.1;
    ctx.rect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = this.color;
    ctx.fill();

    ctx.beginPath();
    ctx.rect(-s / 2, -s / 2, s / 2, s / 2);
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fill();

    ctx.restore();
  }

  collidesWith(px, py, pw, ph) {
    const closestX = Math.max(px, Math.min(this.x, px + pw));
    const closestY = Math.max(py, Math.min(this.y, py + ph));
    const dx = this.x - closestX;
    const dy = this.y - closestY;
    return (dx * dx + dy * dy) < (this.radius * this.radius);
  }
}

//  CLASS: Player
class Player {
  constructor(x, y) {
    this.x      = x;
    this.y      = y;
    this.width  = 32;
    this.height = 32;
    this.speed  = 180; // px / sec
    this._t     = 0;
  }

  update(dt, keys, obstacles, canvasW, canvasH) {
    this._t += dt * 3;
    let dx = 0, dy = 0;

    if (keys["ArrowLeft"]  || keys["a"]) dx -= 1;
    if (keys["ArrowRight"] || keys["d"]) dx += 1;
    if (keys["ArrowUp"]    || keys["w"]) dy -= 1;
    if (keys["ArrowDown"]  || keys["s"]) dy += 1;

    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    const step = this.speed * dt;

    this.x += dx * step;
    this.x  = Math.max(0, Math.min(canvasW - this.width, this.x));
    for (const obs of obstacles) {
      if (obs.collidesWith(this.x, this.y, this.width, this.height)) {
        if (dx > 0) this.x = obs.x - this.width;
        if (dx < 0) this.x = obs.x + obs.width;
      }
    }

    this.y += dy * step;
    this.y  = Math.max(0, Math.min(canvasH - this.height, this.y));
    for (const obs of obstacles) {
      if (obs.collidesWith(this.x, this.y, this.width, this.height)) {
        if (dy > 0) this.y = obs.y - this.height;
        if (dy < 0) this.y = obs.y + obs.height;
      }
    }
  }

  draw(ctx) {
    const cx = this.x + this.width  / 2;
    const cy = this.y + this.height / 2;
    const pulse = 1 + Math.sin(this._t) * 0.06;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    ctx.shadowColor  = "#e91e8c80";
    ctx.shadowBlur   = 16;
    ctx.shadowOffsetY = 4;

    ctx.beginPath();
    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(-4, -6, 2, 0, 0, this.width / 2);
    grad.addColorStop(0,   "#ff80ab");
    grad.addColorStop(0.6, "#e91e8c");
    grad.addColorStop(1,   "#880e4f");
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.shadowBlur = 0;

    // White highlight
    ctx.beginPath();
    ctx.arc(-5, -8, 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.fill();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────
//  PARTICLE SYSTEM  (collect burst)
// ─────────────────────────────────────────────
class Particle {
  constructor(x, y, color) {
    this.x  = x;  this.y  = y;
    this.vx = (Math.random() - 0.5) * 180;
    this.vy = (Math.random() - 0.5) * 180 - 60;
    this.life = 1;
    this.color = color;
    this.r = 3 + Math.random() * 4;
  }
  update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.vy += 180 * dt; this.life -= dt * 2.2; }
  draw(ctx) {
    if (this.life <= 0) return;
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ─────────────────────────────────────────────
//  GAME SETUP
// ─────────────────────────────────────────────
const canvas  = document.getElementById("game-canvas");
const ctx     = canvas.getContext("2d");
const scoreEl = document.getElementById("score-val");
const winBanner = document.getElementById("win-banner");

let obstacles    = OBSTACLES_DATA.map(d => new Obstacle(d));
let collectibles = COLLECTIBLES_DATA.map(d => new Collectible(d));
let particles    = [];
let player       = new Player(320, 420);
let score        = 0;
let keys         = {};
let lastTime     = null;
let gameWon      = false;

window.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault();
});
window.addEventListener("keyup",   e => { keys[e.key] = false; });

// ─────────────────────────────────────────────
//  BACKGROUND DRAWING
// ─────────────────────────────────────────────
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0,   "#b3e5fc");
  sky.addColorStop(0.45,"#f8bbd0");
  sky.addColorStop(1,   "#fce4ec");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Update
  if (!gameWon) {
    player.update(dt, keys, obstacles, canvas.width, canvas.height);

    // Collectible logic
    for (let i = collectibles.length - 1; i >= 0; i--) {
      const col = collectibles[i];
      if (!col.active) continue;
      col.update(dt);

      if (col.collidesWith(player.x, player.y, player.width, player.height)) {
        col.active = false;
        score += col.points;
        scoreEl.textContent = score;

        // Burst particles
        for (let p = 0; p < 14; p++) particles.push(new Particle(col.x, col.y, col.color));

        collectibles.splice(i, 1);

        if (collectibles.length === 0) {
          gameWon = true;
          winBanner.style.display = "block";
          document.getElementById("final-score").textContent = score;
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update(dt);
    if (particles[i].life <= 0) particles.splice(i, 1);
  }

  // Draw
  drawBackground();
  obstacles.forEach(o => o.draw(ctx));
  collectibles.forEach(c => c.draw(ctx));
  particles.forEach(p => p.draw(ctx));
  player.draw(ctx);

  // Score on canvas (subtle)
  ctx.save();
  ctx.font = "bold 13px 'Nunito', sans-serif";
  ctx.fillStyle = "rgba(173,20,87,0.35)";
  ctx.fillText(`♥ ${collectibles.length} gems left`, 10, canvas.height - 12);
  ctx.restore();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
