<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 6</title>
    <script src="index.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body onload="printBlankBoard();">
    <h1> Week 6 Memory Game</h1>
    <p id="attemptCount" class="attempt-count">Attempts: 0</p>
    <div class="game-board">
        <div class="board-body">
            <div class="board-row">
                <img class="board-cell" id="img1" src="" onclick="flip(0)" alt="Memory card 1">
                <img class="board-cell" id="img2" src="" onclick="flip(1)" alt="Memory card 2">
                <img class="board-cell" id="img3" src="" onclick="flip(2)" alt="Memory card 3">
                <img class="board-cell" id="img4" src="" onclick="flip(3)" alt="Memory card 4">
            </div>
            <div class="board-row">
                <img class="board-cell" id="img5" src="" onclick="flip(4)" alt="Memory card 5">
                <img class="board-cell" id="img6" src="" onclick="flip(5)" alt="Memory card 6">
                <img class="board-cell" id="img7" src="" onclick="flip(6)" alt="Memory card 7">
                <img class="board-cell" id="img8" src="" onclick="flip(7)" alt="Memory card 8">
            </div>
            <div class="board-row">
                <img class="board-cell" id="img9" src="" onclick="flip(8)" alt="Memory card 9">
                <img class="board-cell" id="img10" src="" onclick="flip(9)" alt="Memory card 10">
                <img class="board-cell" id="img11" src="" onclick="flip(10)" alt="Memory card 11">
                <img class="board-cell" id="img12" src="" onclick="flip(11)" alt="Memory card 12">
            </div>
        </div>
    </div>

</body>
</html>
